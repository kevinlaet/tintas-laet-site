[build]
  publish = "site"
  functions = "netlify/functions"
  ignore = "bash scripts/netlify-ignore-branch.sh"

[[redirects]]
  from = "/sorteios.html"
  to = "/#ganhadores"
  status = 301
  force = true

[[redirects]]
  from = "/sorteios"
  to = "/#ganhadores"
  status = 301
  force = true

[[redirects]]
  from = "/cupom.html"
  to = "/#ganhadores"
  status = 301
  force = true

[[redirects]]
  from = "/cupom-recebido.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# CSP (política de segurança do navegador): só deixa carregar script/estilo/fonte/imagem
# das origens listadas — barra código injetado de fora. Por página (e não em /*) porque
# orcamento.html precisa de 'unsafe-eval' (lê o catálogo de produto.html).
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://script.google.com https://script.googleusercontent.com; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
