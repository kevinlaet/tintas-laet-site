[build]
  publish = "site"
  functions = "netlify/functions"
  ignore = "bash scripts/netlify-ignore-branch.sh"

[[redirects]]
  from = "/sorteios.html"
  to = "/#ganhadores"
  status = 301
  force = true

[[redirects]]
  from = "/sorteios"
  to = "/#ganhadores"
  status = 301
  force = true

[[redirects]]
  from = "/cupom.html"
  to = "/#ganhadores"
  status = 301
  force = true

[[redirects]]
  from = "/cupom-recebido.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[functions."relatorio-diario"]
  schedule = "0 0 * * *"
  included_files = ["site/search-data.js"]
