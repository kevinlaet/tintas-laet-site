<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Foto de Perfil — Vila Luzita</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: 32px;
    font-family: 'Montserrat', 'Arial Black', Arial, sans-serif;
  }

  #design {
    width: 1080px;
    height: 1080px;
    flex-shrink: 0;
    background: #0D47A1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 64px;
  }

  #design img {
    width: 580px;
    display: block;
    filter: brightness(0) invert(1);
  }

  .chip {
    background: #FFC107;
    color: #062B63;
    font-family: 'Montserrat', 'Arial Black', Arial, sans-serif;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 22px 76px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .instrucao {
    color: #aaa;
    font-size: 14px;
    text-align: center;
    line-height: 1.7;
  }
  .instrucao b { color: #FFC107; }
</style>
</head>
<body>

  <div id="design">
    <img src="../../identidade/logo tipo original-remove-bg-io.png" alt="Tintas Laet">
    <div class="chip">Vila Luzita</div>
  </div>

  <p class="instrucao">
    Para salvar: <b>F12</b> → aba <b>Elements</b> → clique direito em <b>&lt;div id="design"&gt;</b> → <b>Capture node screenshot</b>
  </p>

</body>
</html>
