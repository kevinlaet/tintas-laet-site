<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; background: #062B63; }
  * { box-sizing: border-box; }
</style>
</helmet>

<!-- SLIDE 3: CTA FESTIVO — 1080×1350 -->
<div style="width:1080px;height:1350px;background:#062B63;position:relative;overflow:hidden;font-family:'Poppins',sans-serif;">

  <!-- Número "6" fantasma -->
  <div style="position:absolute;right:-120px;bottom:-80px;font-family:'Bebas Neue',sans-serif;font-size:1100px;line-height:1;color:rgba(255,193,7,.05);z-index:0;pointer-events:none;letter-spacing:-.04em;">6</div>

  <!-- Grade sutil -->
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:80px 80px;"></div>

  <!-- Barra amarela topo -->
  <div style="position:absolute;top:0;left:0;right:0;height:8px;background:#FFC107;z-index:20;"></div>

  <!-- HEADER LOGO -->
  <div style="position:absolute;top:28px;left:0;right:0;z-index:10;display:flex;justify-content:center;padding-bottom:24px;border-bottom:1px solid rgba(255,193,7,.15);margin:0 70px;">
    <img src="logo-branco.png" alt="Tintas Laet" style="height:190px;object-fit:contain;">
  </div>

  <!-- MASCOTE -->
  <div style="position:absolute;right:20px;bottom:195px;z-index:8;width:390px;">
    <img src="mascote.png" alt="" style="width:100%;height:auto;object-fit:contain;filter:drop-shadow(-8px 10px 36px rgba(0,0,0,.65));">
  </div>

  <!-- HEADLINE -->
  <div style="position:absolute;left:70px;top:305px;z-index:10;">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
      <div style="width:44px;height:4px;background:#FFC107;"></div>
      <span style="font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#FFC107;">Fique sabendo primeiro</span>
    </div>

    <div style="font-family:'Bebas Neue',sans-serif;font-size:178px;line-height:.87;color:#fff;letter-spacing:.01em;">
      TÁ<br>VINDO<br><span style="color:#FFC107;">AÍ!</span>
    </div>

    <p style="font-size:17px;font-weight:500;color:rgba(255,255,255,.5);margin:18px 0 0;line-height:1.55;max-width:500px;">
      Segue o @Tintaslaet e não perde a data de inauguração e as ofertas de abertura.
    </p>
  </div>

  <!-- CARDS DE CONTATO -->
  <div style="position:absolute;left:70px;right:70px;bottom:100px;z-index:12;display:flex;flex-direction:column;gap:10px;">
    <!-- WhatsApp -->
    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px 22px;display:flex;align-items:center;gap:16px;">
      <div style="width:44px;height:44px;background:#FFC107;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#062B63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
        </svg>
      </div>
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FFC107;">WhatsApp</div>
        <div style="font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;color:#fff;">(11) 97714-0964</div>
      </div>
    </div>

    <!-- Instagram -->
    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px 22px;display:flex;align-items:center;gap:16px;">
      <div style="width:44px;height:44px;background:#FFC107;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#062B63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </div>
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FFC107;">Instagram</div>
        <div style="font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;color:#fff;">@Tintaslaet</div>
      </div>
    </div>
  </div>

  <!-- RODAPÉ -->
  <div style="position:absolute;bottom:0;left:0;right:0;z-index:15;background:rgba(255,193,7,.08);border-top:1px solid rgba(255,193,7,.2);padding:14px 70px;display:flex;align-items:center;justify-content:center;gap:12px;">
    <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,.35);">A tinta nobre da comunidade</span>
    <span style="color:rgba(255,255,255,.18);">·</span>
    <span style="font-size:13px;font-weight:700;color:#FFC107;">tintaslaet.com</span>
  </div>

</div>
</x-dc>
</body>
</html>
