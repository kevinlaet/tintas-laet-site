<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — Ganhadoras do Outubro Premiado</title>
<style>
@font-face { font-family:'Bebas Neue'; font-weight:400; src:url('fonts/bebas-neue-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:700; src:url('fonts/montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:800; src:url('fonts/montserrat-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:600; src:url('fonts/poppins-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:700; src:url('fonts/poppins-latin-700-normal.woff2') format('woff2'); }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#020A18; }
.post { width:1080px; height:1350px; position:relative; overflow:hidden; color:#fff;
  background:
    radial-gradient(ellipse 900px 520px at 50% 18%, rgba(33,110,230,.55) 0%, rgba(13,71,161,0) 70%),
    linear-gradient(180deg, #0D47A1 0%, #0A3A86 36%, #062B63 68%, #03183A 100%); }
.dots { position:absolute; inset:0; z-index:1; opacity:.16;
  background-image: radial-gradient(rgba(255,255,255,.9) 1.4px, transparent 1.6px); background-size:22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 600px 420px at 90% 5%, #000 0%, transparent 70%);
          mask-image: radial-gradient(ellipse 600px 420px at 90% 5%, #000 0%, transparent 70%); }
.cf { position:absolute; z-index:2; }

.top { position:absolute; top:34px; left:0; right:0; z-index:10; display:flex; flex-direction:column; align-items:center; text-align:center; }
.top img { height:290px; margin:-72px 0 -54px; object-fit:contain; filter:drop-shadow(0 4px 18px rgba(0,0,0,.35)); }
.ey { font:700 28px/1 'Poppins',sans-serif; color:#FFE082; letter-spacing:.2em; text-transform:uppercase; display:flex; align-items:center; gap:18px; margin-top:6px; }
.ey::before,.ey::after { content:''; width:44px; height:3px; background:rgba(255,224,130,.6); display:block; }
.big { font:400 218px/.84 'Bebas Neue',sans-serif; color:#fff; margin-top:56px; text-shadow:0 10px 40px rgba(0,0,0,.35); }

.cards { position:absolute; left:56px; right:56px; top:512px; z-index:8; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.c { position:relative; height:572px; border-radius:22px; background:rgba(13,47,102,.78); border:2px solid rgba(255,255,255,.28);
  box-shadow:0 18px 40px rgba(0,0,0,.35); overflow:hidden; }
.c.main { border:3px solid #FFC107; }
.c .tag { position:absolute; top:20px; left:20px; z-index:3; background:#FFC107; color:#062B63; font:400 34px/1 'Bebas Neue',sans-serif; padding:8px 16px 4px; border-radius:10px; letter-spacing:.03em; }
.c.sec .tag { background:#fff; }
.c .glow { position:absolute; left:50%; top:200px; width:340px; height:340px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(255,193,7,.30) 0%, rgba(255,193,7,0) 70%); z-index:1; }
.c img { position:absolute; left:50%; transform:translateX(-50%); z-index:2; filter:drop-shadow(0 18px 22px rgba(0,0,0,.5)); }
.c.main img { top:76px; height:300px; }
.c.sec img { top:78px; height:296px; }
.c .tx { position:absolute; left:16px; right:16px; bottom:22px; z-index:3; text-align:center; }
.c .nome { font:400 92px/.9 'Bebas Neue',sans-serif; color:#FFC107; letter-spacing:.01em; }
.c .pr { font:800 27px/1.15 'Montserrat',sans-serif; color:#fff; margin-top:8px; }
.c .ds { font:600 21px/1.25 'Poppins',sans-serif; color:#FFE082; margin-top:6px; }

.msg { position:absolute; left:70px; right:70px; top:1106px; z-index:10; text-align:center; font:600 33px/1.35 'Poppins',sans-serif; }
.msg b { color:#FFC107; font-weight:700; }
.btn { position:absolute; left:50%; top:1206px; transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:14px; white-space:nowrap;
  background:#FFC107; color:#062B63; font:800 38px/1 'Montserrat',sans-serif; padding:15px 38px; border-radius:60px; box-shadow:0 10px 26px rgba(0,0,0,.4); }
.btn svg { width:40px; height:40px; fill:#062B63; }
.sub { position:absolute; left:0; right:0; top:1296px; z-index:10; text-align:center; font:700 26px/1 'Poppins',sans-serif; color:#fff; }
.sub b { color:#FFE082; }
</style>
</head>
<body>
<div class="post">
  <div class="dots"></div>
  <div id="confete"></div>

  <div class="top">
    <img src="../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">
    <div class="ey">Outubro Premiado</div>
    <div class="big">PARABÉNS!</div>
  </div>

  <div class="cards">
    <div class="c main">
      <div class="tag">1º PRÊMIO</div>
      <div class="glow"></div>
      <img src="../../sorteio/caixa de som mondial 250w.png" alt="Caixa de Som Mondial 250W">
      <div class="tx"><div class="nome">MARILENE</div><div class="pr">Caixa de Som Mondial 250W</div></div>
    </div>
    <div class="c sec">
      <div class="tag">2º PRÊMIO</div>
      <div class="glow"></div>
      <img src="../../sorteio/cobertura absoluta.png" alt="Tinta Cobertura Absoluta 3,6L">
      <div class="tx"><div class="nome">CAMILA</div><div class="pr">Cobertura Absoluta 3,6L</div><div class="ds">Indicada da Marilene</div></div>
    </div>
  </div>

  <div class="msg">Marilene e Camila, <b>fiquem de olho no WhatsApp:</b><br>nossa equipe vai entrar em contato com vocês.</div>
  <div class="btn"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>(11) 97714-0964</div>
  <div class="sub"><b>@Tintaslaet</b> · tintaslaet.com</div>
</div>
<script>
  const cores=['#FFC107','#FFE082','#FFFFFF','#4F8FE8'];
  let s=41; const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const c=document.getElementById('confete');
  for(let i=0;i<44;i++){
    const x=r()*1080, y=20+r()*470;
    if(x>150&&x<930&&y>20&&y<500) { i--; continue; }
    const d=document.createElement('div'); d.className='cf';
    const w=8+r()*14, h=w*(r()<.5?.45:1);
    Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',background:cores[i%4],
      transform:`rotate(${r()*180}deg)`,opacity:.55+r()*.4,borderRadius:r()<.3?'50%':'3px'});
    c.appendChild(d);
  }
</script>
</body>
</html>
