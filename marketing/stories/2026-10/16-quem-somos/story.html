<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — Quem somos</title>
<style>
@font-face { font-family:'Bebas Neue'; font-weight:400; src:url('fonts/bebas-neue-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:700; src:url('fonts/montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:800; src:url('fonts/montserrat-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:600; src:url('fonts/poppins-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:700; src:url('fonts/poppins-latin-700-normal.woff2') format('woff2'); }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#020A18; }
.slide { width:1080px; height:1920px; position:relative; overflow:hidden; color:#fff; }

.foto { position:absolute; inset:0; z-index:0; background:url('../../../../marketing/prova social/equipe tintas laet.jpg') center 18% / cover no-repeat; }
.scrim-top { position:absolute; top:0; left:0; right:0; height:620px; z-index:1;
  background:linear-gradient(180deg, rgba(2,10,24,.88) 0%, rgba(2,10,24,.55) 48%, rgba(2,10,24,0) 100%); }
.scrim-bot { position:absolute; bottom:0; left:0; right:0; height:1180px; z-index:1;
  background:linear-gradient(180deg, rgba(2,10,24,0) 0%, rgba(3,24,58,.72) 22%, #062043 48%, #03162f 100%); }

.top { position:absolute; top:96px; left:0; right:0; z-index:10; display:flex; flex-direction:column; align-items:center; text-align:center; }
.top img { height:270px; margin:-66px 0 -46px; object-fit:contain; filter:drop-shadow(0 4px 18px rgba(0,0,0,.4)); }
.ey { font:700 27px/1 'Poppins',sans-serif; color:#FFE082; letter-spacing:.24em; text-transform:uppercase; display:flex; align-items:center; gap:18px; margin-top:4px; }
.ey::before,.ey::after { content:''; width:44px; height:3px; background:rgba(255,224,130,.6); display:block; }
.num { font:400 198px/.86 'Bebas Neue',sans-serif; color:#fff; margin-top:18px; text-shadow:0 10px 40px rgba(0,0,0,.4); }

.corpo { position:absolute; left:0; right:0; bottom:0; top:860px; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 80px; }
.msg { font:600 32px/1.45 'Poppins',sans-serif; margin-top:46px; }
.msg b { color:#FFC107; font-weight:700; }

.fatos { display:flex; gap:16px; margin-top:52px; }
.fato { background:rgba(255,255,255,.08); border:2px solid rgba(255,224,130,.5); border-radius:16px; padding:20px 22px 14px; flex:1; }
.fato .n { font:400 54px/.9 'Bebas Neue',sans-serif; color:#FFC107; }
.fato .l { font:700 19px/1.2 'Montserrat',sans-serif; color:#fff; margin-top:8px; text-transform:uppercase; letter-spacing:.02em; }

.nota { font:600 20px/1.3 'Poppins',sans-serif; color:rgba(255,255,255,.65); margin-top:18px; }

.cta { margin-top:56px; white-space:nowrap; background:#FFC107; color:#062B63; font:800 28px/1 'Montserrat',sans-serif;
  padding:20px 38px; border-radius:40px; box-shadow:0 10px 26px rgba(0,0,0,.35); }
.foot { position:absolute; left:0; right:0; bottom:64px; z-index:10; text-align:center;
  font:600 23px/1 'Poppins',sans-serif; color:rgba(255,255,255,.85); letter-spacing:.01em; }
.foot b { color:#FFE082; font-weight:700; }
</style>
</head>
<body>
<div class="slide">
  <div class="foto"></div>
  <div class="scrim-top"></div>
  <div class="scrim-bot"></div>

  <div class="top">
    <img src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">
    <div class="ey">Quem somos</div>
    <div class="num">LAET</div>
  </div>

  <div class="corpo">
    <div class="msg">Negócio de família, tocado por <b>Anderson e Robson Laet</b>.<br>6 lojas no ABC e na Zona Leste de São Paulo, pra quem quer economizar na reforma de verdade.</div>

    <div class="fatos">
      <div class="fato"><div class="n">6</div><div class="l">Lojas</div></div>
      <div class="fato"><div class="n">12x</div><div class="l">Sem juros*</div></div>
      <div class="fato"><div class="n">↓</div><div class="l">Preço de<br>mercado</div></div>
    </div>
    <div class="nota">*consulte as condições</div>

    <div class="cta">Vem conhecer a Laet</div>
  </div>

  <div class="foot"><b>@Tintaslaet</b> · (11) 97714-0964 · tintaslaet.com</div>
</div>
</body>
</html>
