<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — 6 lojas</title>
<style>
@font-face { font-family:'Bebas Neue'; font-weight:400; src:url('fonts/bebas-neue-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:700; src:url('fonts/montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:800; src:url('fonts/montserrat-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:600; src:url('fonts/poppins-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:700; src:url('fonts/poppins-latin-700-normal.woff2') format('woff2'); }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#020A18; }
.slide { width:1080px; height:1920px; position:relative; overflow:hidden; color:#fff;
  background:
    radial-gradient(ellipse 900px 620px at 50% 20%, rgba(33,110,230,.55) 0%, rgba(13,71,161,0) 70%),
    radial-gradient(ellipse 760px 520px at 50% 66%, rgba(255,193,7,.10) 0%, rgba(255,193,7,0) 70%),
    linear-gradient(180deg, #0D47A1 0%, #0A3A86 36%, #062B63 68%, #03183A 100%); }
.dots { position:absolute; inset:0; z-index:1; opacity:.16;
  background-image: radial-gradient(rgba(255,255,255,.9) 1.4px, transparent 1.6px); background-size:22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 600px 500px at 90% 6%, #000 0%, transparent 70%);
          mask-image: radial-gradient(ellipse 600px 500px at 90% 6%, #000 0%, transparent 70%); }

.top { position:absolute; top:150px; left:0; right:0; z-index:10; display:flex; flex-direction:column; align-items:center; text-align:center; }
.top img { height:300px; margin:-74px 0 -55px; object-fit:contain; filter:drop-shadow(0 4px 18px rgba(0,0,0,.35)); }
.ey { font:700 28px/1 'Poppins',sans-serif; color:#FFE082; letter-spacing:.18em; text-transform:uppercase; display:flex; align-items:center; gap:16px; margin-top:8px; }
.ey::before,.ey::after { content:''; width:36px; height:3px; background:rgba(255,224,130,.6); display:block; }
.big { font:400 270px/.82 'Bebas Neue',sans-serif; color:#fff; margin-top:30px; text-shadow:0 10px 40px rgba(0,0,0,.35); }
.big span { color:#FFC107; }
.chip { margin-top:12px; background:#FFC107; color:#062B63; font:400 64px/1 'Bebas Neue',sans-serif; padding:10px 30px 4px; border-radius:14px; transform:rotate(-2deg); box-shadow:0 12px 30px rgba(0,0,0,.35); letter-spacing:.02em; }

.lista { position:absolute; left:64px; right:64px; top:776px; z-index:8; display:flex; flex-direction:column; gap:12px; }
.ln { position:relative; display:flex; align-items:center; gap:24px; height:104px; padding:0 30px 0 22px; border-radius:20px; background:rgba(13,47,102,.74); border:2px solid rgba(255,255,255,.24); box-shadow:0 10px 26px rgba(0,0,0,.3); }
.ln.nova { border:3px solid #FFC107; background:rgba(13,47,102,.9); }
.ln .n { flex:0 0 auto; width:68px; height:68px; border-radius:50%; background:linear-gradient(160deg,#FFD54A,#FFA000); color:#062B63; font:400 56px/68px 'Bebas Neue',sans-serif; text-align:center; padding-top:3px; box-shadow:0 6px 14px rgba(0,0,0,.35); }
.ln .b { flex:1 1 auto; font:800 40px/1.05 'Montserrat',sans-serif; color:#fff; white-space:nowrap; }
.ln .c { flex:0 0 auto; font:700 27px/1.1 'Poppins',sans-serif; color:#FFE082; text-align:right; white-space:nowrap; }
.ln .tag { position:absolute; top:-14px; right:22px; background:#FFC107; color:#062B63; font:400 30px/1 'Bebas Neue',sans-serif; padding:6px 12px 2px; border-radius:8px; transform:rotate(2deg); box-shadow:0 4px 10px rgba(0,0,0,.35); letter-spacing:.03em; }

.msg { position:absolute; left:60px; right:60px; top:1492px; z-index:10; text-align:center; font:600 38px/1.3 'Poppins',sans-serif; }
.msg b { color:#FFC107; font-weight:700; }
.btn { position:absolute; left:50%; top:1574px; transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:16px; white-space:nowrap;
  background:#FFC107; color:#062B63; font:800 44px/1 'Montserrat',sans-serif; padding:20px 44px; border-radius:60px; box-shadow:0 12px 30px rgba(0,0,0,.4); }
.btn svg { width:48px; height:48px; fill:#062B63; }
.sub { position:absolute; left:0; right:0; top:1670px; z-index:10; text-align:center; font:700 30px/1 'Poppins',sans-serif; color:#fff; }
.sub b { color:#FFE082; }
</style>
</head>
<body>
<div class="slide">

    <img src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">
    <div class="ey">ABC e Zona Leste</div>

    <div class="ln"><div class="n">3</div><div class="b">Jardim Santa Cecília</div><div class="c">Mauá</div></div>
    <div class="ln"><div class="n">4</div><div class="b">Vila Luzita</div><div class="c">Santo André</div></div>

</div>
</body>
