<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
@font-face { font-family:"Bebas Neue"; font-weight:400; src:url("fonts/bebas-neue-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family:"Montserrat"; font-weight:700; src:url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family:"Montserrat"; font-weight:800; src:url("fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family:"Poppins"; font-weight:600; src:url("fonts/poppins-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family:"Poppins"; font-weight:700; src:url("fonts/poppins-latin-700-normal.woff2") format("woff2"); }
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#020A18; }
.slide { width:1080px; height:1920px; position:relative; overflow:hidden; color:#fff; }
.abs { position:absolute; z-index:5; }
.chip { display:inline-block; background:#FFC107; color:#062B63; border-radius:14px; transform:rotate(-2deg); box-shadow:0 10px 30px rgba(0,0,0,.3); }
.ey { font:700 26px/1 "Poppins",sans-serif; color:#FFC107; letter-spacing:.25em; text-transform:uppercase; display:flex; align-items:center; gap:16px; justify-content:center; }
.ey::before,.ey::after { content:""; width:40px; height:3px; background:rgba(255,193,7,.55); }
.tel { display:inline-block; background:#FFC107; color:#062B63; font:800 54px/1 "Montserrat",sans-serif; padding:26px 52px; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.35); }

.slide { background:
    radial-gradient(ellipse 950px 700px at 50% 18%, rgba(40,120,240,.6) 0%, rgba(13,71,161,0) 70%),
    radial-gradient(ellipse 900px 520px at 50% 100%, rgba(255,193,7,.16) 0%, rgba(255,193,7,0) 70%),
    linear-gradient(180deg, #0D47A1 0%, #0A3A86 40%, #062B63 72%, #031A40 100%); }
.slide::before { content:""; position:absolute; inset:0;
  background-image: repeating-linear-gradient(60deg, rgba(255,255,255,.025) 0, rgba(255,255,255,.025) 1px, transparent 1px, transparent 60px),
                   repeating-linear-gradient(-60deg, rgba(255,255,255,.025) 0, rgba(255,255,255,.025) 1px, transparent 1px, transparent 60px); }
.top { left:0; right:0; top:110px; text-align:center; }
.top img { height:200px; filter:drop-shadow(0 4px 16px rgba(0,0,0,.3)); }
.top .ey { margin-top:44px; }
h1 { font:400 150px/.9 "Bebas Neue",sans-serif; margin-top:18px; }
h1 .chip { padding:4px 32px 0; }
.pin { left:70px; right:70px; top:780px; background:#fff; color:#062B63; border-radius:18px; padding:40px 44px; display:flex; gap:32px; align-items:center; box-shadow:0 18px 40px rgba(0,0,0,.35); }
.pin .ic { flex:none; width:110px; height:110px; border-radius:50%; background:#FFC107; display:flex; align-items:center; justify-content:center; }
.pin .ic svg { width:58px; height:58px; }
.pin b { display:block; font:400 34px/1 "Bebas Neue",sans-serif; color:#0D47A1; letter-spacing:.14em; }
.pin .e { font:800 42px/1.12 "Montserrat",sans-serif; margin-top:10px; }
.pin .b { font:600 27px/1.3 "Poppins",sans-serif; color:#444; margin-top:8px; }
.list { left:70px; right:70px; top:1110px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.it { background:rgba(6,43,99,.6); border:1px solid rgba(255,255,255,.22); border-top:5px solid #FFC107; border-radius:10px; padding:26px 16px; text-align:center; font:700 27px/1.25 "Poppins",sans-serif; }
.it span { display:block; font:400 64px/1 "Bebas Neue",sans-serif; color:#FFC107; margin-bottom:8px; }
.maps { left:70px; right:70px; top:1360px; text-align:center; font:600 30px/1.35 "Poppins",sans-serif; }
.maps b { color:#FFC107; font-weight:700; }
.cta { left:0; right:0; top:1470px; text-align:center; }
.cta p { font:600 30px/1 "Poppins",sans-serif; margin-bottom:20px; }
</style>
</head>
<body>
<div class="slide">
  <div class="abs top">
    <img src="../../../../identidade/logotipo-branco-recortado.png" alt="Tintas Laet">
    <div class="ey">Loja 6 já está aberta</div>
    <h1>MORA EM<br><span class="chip">SÃO BERNARDO?</span></h1>
  </div>
  <div class="abs pin">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#062B63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
    <div><b>A LAET AGORA TÁ AQUI</b><div class="e">Av. Luís Pequini, 899</div><div class="b">Santa Terezinha — São Bernardo do Campo</div></div>
  </div>
  <div class="abs list">
    <div class="it"><span>200+</span>cores pra escolher</div>
    <div class="it"><span>12X</span>sem juros no cartão</div>
    <div class="it"><span>6</span>lojas no ABC e ZL</div>
  </div>
  <div class="abs maps">No <b>Google Maps</b>: procure <b>Tintas Laet</b></div>
  <div class="abs cta"><p>Chama no WhatsApp:</p><div class="tel">(11) 97714-0964</div></div>
</div>
</body>
</html>
