<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — Sorteio de setembro é hoje</title>
<style>
@font-face { font-family:'Bebas Neue'; font-weight:400; src:url('fonts/bebas-neue-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:700; src:url('fonts/montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:800; src:url('fonts/montserrat-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:600; src:url('fonts/poppins-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:700; src:url('fonts/poppins-latin-700-normal.woff2') format('woff2'); }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#020A18; }
.slide { width:1080px; height:1920px; position:relative; overflow:hidden; color:#fff;
  background:
    radial-gradient(ellipse 900px 620px at 50% 22%, rgba(33,110,230,.55) 0%, rgba(13,71,161,0) 70%),
    radial-gradient(ellipse 760px 520px at 50% 66%, rgba(255,193,7,.16) 0%, rgba(255,193,7,0) 70%),
    linear-gradient(180deg, #0D47A1 0%, #0A3A86 36%, #062B63 68%, #03183A 100%); }
.dots { position:absolute; inset:0; z-index:1; opacity:.16;
  background-image: radial-gradient(rgba(255,255,255,.9) 1.4px, transparent 1.6px); background-size:22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 600px 500px at 90% 6%, #000 0%, transparent 70%);
          mask-image: radial-gradient(ellipse 600px 500px at 90% 6%, #000 0%, transparent 70%); }
.cf { position:absolute; z-index:2; }

.top { position:absolute; top:150px; left:0; right:0; z-index:10; display:flex; flex-direction:column; align-items:center; text-align:center; }
.top img { height:300px; margin:-74px 0 -55px; object-fit:contain; filter:drop-shadow(0 4px 18px rgba(0,0,0,.35)); }
.ey { font:700 27px/1 'Poppins',sans-serif; color:#FFE082; letter-spacing:.24em; text-transform:uppercase; display:flex; align-items:center; gap:18px; margin-top:8px; }
.ey::before,.ey::after { content:''; width:44px; height:3px; background:rgba(255,224,130,.6); display:block; }
.num { font:400 290px/.82 'Bebas Neue',sans-serif; color:#fff; margin-top:62px; text-shadow:0 10px 40px rgba(0,0,0,.35); }
.chip { display:inline-flex; align-items:center; gap:18px; margin-top:12px; background:#FFC107; color:#062B63; font:400 72px/1 'Bebas Neue',sans-serif;
  padding:12px 32px 6px; border-radius:16px; transform:rotate(-2deg); box-shadow:0 10px 30px rgba(0,0,0,.3); letter-spacing:.02em; }
.live { width:22px; height:22px; border-radius:50%; background:#E53935; box-shadow:0 0 0 6px rgba(229,57,53,.25); margin-top:-6px; }

.prizes { position:absolute; left:64px; right:64px; top:830px; z-index:8; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.p { position:relative; height:640px; border-radius:22px; background:rgba(13,47,102,.75); border:2px solid rgba(255,255,255,.28);
  box-shadow:0 18px 40px rgba(0,0,0,.35); overflow:hidden; }
.p.main { border:3px solid #FFC107; }
.p .tag { position:absolute; top:22px; left:22px; z-index:3; background:#FFC107; color:#062B63; font:400 36px/1 'Bebas Neue',sans-serif;
  padding:8px 16px 4px; border-radius:10px; letter-spacing:.03em; }
.p.sec .tag { background:#fff; }
.p img { position:absolute; left:50%; transform:translateX(-50%); z-index:2; filter:drop-shadow(0 20px 26px rgba(0,0,0,.5)); }
.p.main img { top:60px; height:450px; }
.p.sec img { top:90px; height:350px; }
.p .glow { position:absolute; left:50%; top:270px; width:360px; height:360px; transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(circle, rgba(255,193,7,.32) 0%, rgba(255,193,7,0) 70%); z-index:1; }
.p .tx { position:absolute; left:24px; right:24px; bottom:26px; z-index:3; text-align:center; }
.p .nm { font:800 31px/1.15 'Montserrat',sans-serif; color:#fff; }
.p .ds { font:600 21px/1.3 'Poppins',sans-serif; color:#FFE082; margin-top:10px; }

.msg { position:absolute; left:80px; right:80px; top:1505px; z-index:10; text-align:center; font:600 31px/1.4 'Poppins',sans-serif; }
.msg b { color:#FFC107; font-weight:700; }
.cta { position:absolute; left:50%; top:1640px; transform:translateX(-50%); z-index:10; white-space:nowrap;
  background:#FFC107; color:#062B63; font:800 28px/1 'Montserrat',sans-serif; padding:20px 38px; border-radius:40px;
  box-shadow:0 10px 26px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="slide">
  <div class="dots"></div>
  <div id="confete"></div>

  <div class="top">
    <img src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">
    <div class="ey">Sorteio de setembro</div>
    <div class="num">É HOJE!</div>
    <div class="chip"><span class="live"></span>AO VIVO NO INSTAGRAM</div>
  </div>

  <div class="prizes">
    <div class="p main">
      <div class="tag">1º PRÊMIO</div>
      <div class="glow"></div>
      <img src="caixa.png" alt="Caixa de Som Mondial 250W">
      <div class="tx"><div class="nm">Caixa de Som<br>Mondial 250W</div><div class="ds">Pro dono do cupom sorteado</div></div>
    </div>
    <div class="p sec">
      <div class="tag">2º PRÊMIO</div>
      <div class="glow"></div>
      <img src="tinta.png" alt="Tinta Cobertura Absoluta 3,6L">
      <div class="tx"><div class="nm">Cobertura Absoluta<br>3,6L Branca</div><div class="ds">Pra um dos amigos indicados<br>pelo ganhador</div></div>
    </div>
  </div>

  <div class="msg">Comprou e preencheu o cupom na loja?<br><b>Você já está concorrendo.</b></div>
  <div class="cta">Assiste a live no @Tintaslaet</div>
</div>
<script>
  const cores=['#FFC107','#FFE082','#FFFFFF','#4F8FE8'];
  let s=23; const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const c=document.getElementById('confete');
  for(let i=0;i<40;i++){
    const x=r()*1080, y=60+r()*740;
    if(x>150&&x<930&&y>120) { i--; continue; }
    const d=document.createElement('div'); d.className='cf';
    const w=8+r()*12, h=w*(r()<.5?.45:1);
    Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',background:cores[i%4],
      transform:`rotate(${r()*180}deg)`,opacity:.55+r()*.4,borderRadius:r()<.3?'50%':'3px'});
    c.appendChild(d);
  }
</script>
</body>
</html>
