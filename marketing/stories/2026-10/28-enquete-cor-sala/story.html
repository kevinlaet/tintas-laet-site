<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — Enquete: qual cor pra sala?</title>
<style>
@font-face { font-family:'Bebas Neue'; font-weight:400; src:url('fonts/bebas-neue-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:700; src:url('fonts/montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:800; src:url('fonts/montserrat-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:600; src:url('fonts/poppins-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:700; src:url('fonts/poppins-latin-700-normal.woff2') format('woff2'); }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#020A18; }
.slide { width:1080px; height:1920px; position:relative; overflow:hidden; color:#fff;
  background:
    radial-gradient(ellipse 900px 640px at 50% 22%, rgba(33,110,230,.5) 0%, rgba(13,71,161,0) 70%),
    linear-gradient(180deg, #0D47A1 0%, #0A3A86 36%, #062B63 68%, #03183A 100%); }
.dots { position:absolute; inset:0; z-index:1; opacity:.14;
  background-image: radial-gradient(rgba(255,255,255,.9) 1.4px, transparent 1.6px); background-size:22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 600px 500px at 92% 5%, #000 0%, transparent 70%);
          mask-image: radial-gradient(ellipse 600px 500px at 92% 5%, #000 0%, transparent 70%); }
.logo { position:absolute; top:122px; left:0; right:0; z-index:10; text-align:center; }
.logo img { height:220px; margin:-54px 0 -40px; object-fit:contain; filter:drop-shadow(0 4px 18px rgba(0,0,0,.35)); }
.ey { position:absolute; left:0; right:0; top:300px; z-index:10; display:flex; justify-content:center; }
.ey span { background:#FFC107; color:#062B63; font:400 44px/1 'Bebas Neue',sans-serif; letter-spacing:.14em; padding:10px 22px 4px 28px; border-radius:10px; }
.h { position:absolute; left:0; right:0; top:378px; z-index:10; text-align:center; font:400 128px/.88 'Bebas Neue',sans-serif; text-shadow:0 10px 36px rgba(0,0,0,.4); }
.h b { color:#FFC107; font-weight:400; }

.cards { position:absolute; left:50px; right:50px; top:640px; z-index:8; display:grid; grid-template-columns:1fr 1fr; gap:30px; }
.cd { background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 26px 50px rgba(0,0,0,.5); }
.cd.a { transform:rotate(-2deg); }
.cd.b { transform:rotate(2deg); }
.cd .sala { position:relative; height:540px; }
.cd .sala svg { position:absolute; left:0; bottom:0; width:100%; height:auto; display:block; }
.cd .lb { display:flex; align-items:center; gap:18px; padding:22px 24px 24px; color:#062B63; }
.cd .lt { flex:0 0 auto; width:76px; height:76px; border-radius:50%; background:#FFC107; font:400 64px/76px 'Bebas Neue',sans-serif; text-align:center; padding-top:4px; color:#062B63; }
.cd .nm { font:800 36px/1.05 'Montserrat',sans-serif; }
.cd .ln { font:600 23px/1.2 'Poppins',sans-serif; color:#5A6B85; margin-top:6px; }

.vote { position:absolute; left:0; right:0; top:1400px; z-index:10; text-align:center; font:400 64px/1 'Bebas Neue',sans-serif; color:#FFC107; letter-spacing:.04em; }
.vote svg { width:44px; height:44px; vertical-align:-6px; margin-left:8px; }
.rod { position:absolute; left:0; right:0; top:1640px; z-index:10; text-align:center; font:700 26px/1 'Poppins',sans-serif; color:rgba(255,255,255,.92); }
.rod b { color:#FFE082; }
.aviso { position:absolute; left:80px; right:80px; top:1684px; z-index:10; text-align:center; font:600 19px/1.3 'Poppins',sans-serif; color:rgba(255,255,255,.62); }
</style>
</head>
<body>
<div class="slide">
  <div class="dots"></div>
  <div class="logo"><img src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet"></div>
  <div class="ey"><span>ENQUETE</span></div>
  <div class="h">QUAL VOCÊ ESCOLHERIA<br><b>PRA SUA SALA?</b></div>

  <div class="cards">
    <div class="cd a">
      <div class="sala" style="background:#F4ECD7"></div>
      <div class="lb"><div class="lt">A</div><div><div class="nm">Algodão Egípcio</div><div class="ln">Premium Lavável</div></div></div>
    </div>
    <div class="cd b">
      <div class="sala" style="background:#9F7A5C"></div>
      <div class="lb"><div class="lt">B</div><div><div class="nm">Terra Nossa</div><div class="ln">Premium Lavável</div></div></div>
    </div>
  </div>

  <div class="vote">VOTA NA ENQUETE AQUI EMBAIXO<svg viewBox="0 0 24 24"><path d="M12 4v15M5 12l7 7 7-7" stroke="#FFC107" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="rod"><b>@Tintaslaet</b> · (11) 97714-0964 · tintaslaet.com</div>
  <div class="aviso">A tela pode mostrar a cor um pouco diferente. Confira no catálogo físico na loja.</div>
</div>
<script>
  const sofa = `<svg viewBox="0 0 470 300" xmlns="http://www.w3.org/2000/svg">
    <rect x="300" y="38" width="120" height="90" rx="6" fill="none" stroke="#2C3E5C" stroke-width="6"/>
    <rect x="316" y="54" width="88" height="58" rx="3" fill="#2C3E5C" opacity="0"/>
    <path d="M 70 46 q 18 -40 36 0" fill="none" stroke="#2C3E5C" stroke-width="5"/>
    <rect x="58" y="44" width="58" height="10" rx="4" fill="#2C3E5C"/>
    <rect x="84" y="54" width="6" height="150" fill="#2C3E5C"/>
    <rect x="66" y="200" width="42" height="8" rx="3" fill="#2C3E5C"/>
    <rect x="134" y="132" width="290" height="84" rx="26" fill="#2C3E5C"/>
    <rect x="120" y="178" width="318" height="70" rx="22" fill="#24344F"/>
    <rect x="116" y="160" width="44" height="92" rx="20" fill="#2C3E5C"/>
    <rect x="398" y="160" width="44" height="92" rx="20" fill="#2C3E5C"/>
    <rect x="146" y="248" width="10" height="20" rx="3" fill="#1A263B"/>
    <rect x="402" y="248" width="10" height="20" rx="3" fill="#1A263B"/>
    <rect x="0" y="266" width="470" height="34" fill="#152443"/>
  </svg>`;
  document.querySelectorAll('.sala').forEach(s => s.insertAdjacentHTML('beforeend', sofa));
</script>
</body>
</html>
