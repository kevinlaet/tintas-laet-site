<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Story — Sorteio mensal e prêmios</title>
<style>
@font-face { font-family:'Bebas Neue'; font-weight:400; src:url('fonts/bebas-neue-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:700; src:url('fonts/montserrat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family:'Montserrat'; font-weight:800; src:url('fonts/montserrat-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:600; src:url('fonts/poppins-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family:'Poppins'; font-weight:700; src:url('fonts/poppins-latin-700-normal.woff2') format('woff2'); }
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#020A18; }
.slide { width:1080px; height:1920px; position:relative; overflow:hidden; color:#fff;
  background:
    radial-gradient(ellipse 950px 700px at 50% 20%, rgba(40,120,240,.6) 0%, rgba(13,71,161,0) 70%),
    radial-gradient(ellipse 900px 520px at 50% 100%, rgba(255,193,7,.20) 0%, rgba(255,193,7,0) 70%),
    linear-gradient(180deg, #0D47A1 0%, #0A3A86 40%, #062B63 72%, #031A40 100%); }
/* raios atrás do título */
.rays { position:absolute; left:50%; top:430px; width:1900px; height:1900px; transform:translate(-50%,-50%); z-index:1;
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.075) 0deg 6deg, rgba(255,255,255,0) 6deg 15deg);
  -webkit-mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 50%); mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 50%); }
.dots { position:absolute; inset:0; z-index:1; opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.9) 1.4px, transparent 1.6px); background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 520px 420px at 0% 100%, #000 0%, transparent 70%), radial-gradient(ellipse 520px 420px at 100% 30%, #000 0%, transparent 70%);
          mask-image:radial-gradient(ellipse 520px 420px at 0% 100%, #000 0%, transparent 70%), radial-gradient(ellipse 520px 420px at 100% 30%, #000 0%, transparent 70%); }
.cf { position:absolute; z-index:2; }
.abs { position:absolute; z-index:5; }

.top { left:0; right:0; top:70px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.top .logo { height:170px; object-fit:contain; filter:drop-shadow(0 4px 16px rgba(0,0,0,.35)); }
.ey { font:700 26px/1 'Poppins',sans-serif; color:#FFE082; letter-spacing:.24em; text-transform:uppercase; display:flex; align-items:center; gap:18px; margin-top:18px; }
.ey::before,.ey::after { content:''; width:44px; height:3px; background:rgba(255,224,130,.6); }
h1 { font:400 210px/.86 'Bebas Neue',sans-serif; color:#fff; margin-top:18px; letter-spacing:.01em; text-shadow:0 12px 40px rgba(0,0,0,.4); }
.chip { margin-top:-6px; background:#FFC107; color:#062B63; font:400 108px/1 'Bebas Neue',sans-serif; padding:10px 44px 2px; border-radius:16px; transform:rotate(-2.5deg); box-shadow:0 12px 30px rgba(0,0,0,.35); letter-spacing:.02em; }

.p { left:70px; right:70px; height:380px; border-radius:24px; overflow:visible;
  background:linear-gradient(135deg, rgba(25,90,190,.92) 0%, rgba(8,48,112,.95) 55%, rgba(5,33,80,.97) 100%);
  border:2px solid rgba(255,255,255,.28); box-shadow:0 22px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
.p.main { top:672px; border:3px solid #FFC107; box-shadow:0 22px 50px rgba(0,0,0,.45), 0 0 60px rgba(255,193,7,.18), inset 0 1px 0 rgba(255,255,255,.25); }
.p.sec { top:1104px; }
.clip { position:absolute; inset:0; border-radius:22px; overflow:hidden; }
.ghost { position:absolute; top:-30px; font:400 480px/1 'Bebas Neue',sans-serif; color:transparent; -webkit-text-stroke:3px rgba(255,255,255,.12); }
.spot { position:absolute; top:50%; width:520px; height:520px; border-radius:50%; transform:translateY(-50%);
  background:radial-gradient(circle, rgba(255,210,80,.55) 0%, rgba(255,193,7,.2) 38%, rgba(255,193,7,0) 68%); }
.stripe { position:absolute; bottom:0; height:8px; left:0; right:0; background:linear-gradient(90deg, rgba(255,193,7,0), rgba(255,193,7,.8), rgba(255,193,7,0)); }
.floor { position:absolute; width:320px; height:44px; border-radius:50%; background:radial-gradient(ellipse, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 70%); }
.p img { position:absolute; z-index:3; filter:drop-shadow(0 22px 26px rgba(0,0,0,.55)); }
.tx { position:absolute; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; z-index:4; text-align:left; }
.tag { align-self:flex-start; background:#FFC107; color:#062B63; font:400 42px/1 'Bebas Neue',sans-serif; padding:9px 20px 3px; border-radius:10px; letter-spacing:.03em; }
.sec .tag { background:#fff; }
.nm { font:800 44px/1.08 'Montserrat',sans-serif; color:#fff; margin-top:18px; }
.ds { font:600 26px/1.3 'Poppins',sans-serif; color:#FFE082; margin-top:12px; }

.main .ghost { right:30px; } .main .spot { left:-80px; } .main .floor { left:50px; bottom:-14px; }
.main img { left:40px; top:-120px; height:520px; }
.main .tx { left:385px; right:30px; }
.sec .ghost { left:30px; } .sec .spot { right:-80px; } .sec .floor { right:50px; bottom:-14px; }
.sec img { right:22px; top:-48px; height:430px; }
.sec .tx { left:44px; right:420px; }

/* cupom */
.ticket { left:70px; right:70px; top:1528px; height:178px; display:flex; filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
.tk-main { flex:1; background:#fff; border-radius:16px 0 0 16px; display:flex; align-items:center; position:relative;
  -webkit-mask:radial-gradient(circle 18px at 100% 0, transparent 98%, #000) top right/100% 51% no-repeat, radial-gradient(circle 18px at 100% 100%, transparent 98%, #000) bottom right/100% 51% no-repeat;
          mask:radial-gradient(circle 18px at 100% 0, transparent 98%, #000) top right/100% 51% no-repeat, radial-gradient(circle 18px at 100% 100%, transparent 98%, #000) bottom right/100% 51% no-repeat; }
.tk-label { width:74px; height:100%; display:flex; align-items:center; justify-content:center; border-right:3px dashed rgba(13,71,161,.25); }
.tk-label span { transform:rotate(-90deg); font:400 46px/1 'Bebas Neue',sans-serif; color:#0D47A1; letter-spacing:.18em; white-space:nowrap; }
.tk-steps { flex:1; display:grid; grid-template-columns:repeat(3,1fr); padding:0 10px; }
.tk-st { text-align:center; padding:0 6px; }
.tk-st .n { width:50px; height:50px; margin:0 auto; border-radius:50%; background:#0D47A1; color:#FFC107; font:400 40px/53px 'Bebas Neue',sans-serif; }
.tk-st .t { font:700 23px/1.22 'Poppins',sans-serif; color:#062B63; margin-top:10px; }
.tk-stub { width:250px; background:#FFC107; border-radius:0 16px 16px 0; border-left:4px dashed rgba(6,43,99,.35); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  -webkit-mask:radial-gradient(circle 18px at 0 0, transparent 98%, #000) top left/100% 51% no-repeat, radial-gradient(circle 18px at 0 100%, transparent 98%, #000) bottom left/100% 51% no-repeat;
          mask:radial-gradient(circle 18px at 0 0, transparent 98%, #000) top left/100% 51% no-repeat, radial-gradient(circle 18px at 0 100%, transparent 98%, #000) bottom left/100% 51% no-repeat; }
.live { display:flex; align-items:center; gap:10px; font:400 50px/1 'Bebas Neue',sans-serif; color:#062B63; letter-spacing:.03em; }
.live i { width:16px; height:16px; border-radius:50%; background:#E53935; box-shadow:0 0 0 5px rgba(229,57,53,.25); margin-top:-6px; }
.handle { font:800 25px/1 'Montserrat',sans-serif; color:#062B63; margin-top:8px; }
</style>
</head>
<body>
<div class="slide">
  <div class="rays"></div>
  <div class="dots"></div>
  <div id="confete"></div>

  <div class="abs top">
    <img class="logo" src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">
    <div class="ey">2 prêmios todo mês</div>
    <h1>SORTEIO</h1>
    <div class="chip">MENSAL</div>
  </div>

  <div class="abs p main">
    <div class="clip"><div class="spot"></div><div class="ghost">1</div><div class="stripe"></div></div>
    <div class="floor"></div>
    <img src="caixa.png" alt="Caixa de Som Mondial 250W">
    <div class="tx"><div class="tag">1º PRÊMIO</div><div class="nm">Caixa de Som<br>Mondial 250W</div><div class="ds">Pro dono do cupom sorteado</div></div>
  </div>

  <div class="abs p sec">
    <div class="clip"><div class="spot"></div><div class="ghost">2</div></div>
    <div class="floor"></div>
    <img src="tinta.png" alt="Tinta Cobertura Absoluta 3,6L">
    <div class="tx"><div class="tag">2º PRÊMIO</div><div class="nm">Cobertura Absoluta<br>3,6L Branca</div><div class="ds">Sorteada entre os amigos indicados pelo ganhador</div></div>
  </div>

  <div class="abs ticket">
    <div class="tk-main">
      <div class="tk-label"><span>CUPOM</span></div>
      <div class="tk-steps">
        <div class="tk-st"><div class="n">1</div><div class="t">Compre de qualquer valor</div></div>
        <div class="tk-st"><div class="n">2</div><div class="t">Preencha o cupom na loja</div></div>
        <div class="tk-st"><div class="n">3</div><div class="t">Indique até 10 amigos</div></div>
      </div>
    </div>
    <div class="tk-stub"><div class="live"><i></i>AO VIVO</div><div class="handle">@Tintaslaet</div></div>
  </div>
</div>
<script>
  const cores=['#FFC107','#FFE082','#FFFFFF','#4F8FE8'];
  let s=41; const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const c=document.getElementById('confete');
  let n=0, tries=0;
  while(n<56 && tries<4000){ tries++;
    const x=r()*1080, y=20+r()*1880;
    const livre = (y<640 && (x<230 || x>850)) || (y>=640 && y<1500 && (x<60 || x>1020)) || (y>1730);
    if(!livre) continue;
    const d=document.createElement('div'); d.className='cf';
    const w=8+r()*14, h=w*(r()<.5?.42:1);
    Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',background:cores[n%4],
      transform:`rotate(${r()*180}deg)`,opacity:.5+r()*.45,borderRadius:r()<.3?'50%':'3px'});
    c.appendChild(d); n++;
  }
</script>
</body>
</html>
