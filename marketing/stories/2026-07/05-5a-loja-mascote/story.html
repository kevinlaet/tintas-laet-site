<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — Mascote Suspense</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  display:flex; flex-direction:column; align-items:center;
  gap:56px; padding:56px 0;
  font-family:'Montserrat',sans-serif;
}

.slide { width:1080px; height:1920px; position:relative; overflow:hidden; flex-shrink:0; }

/* fundo escuro com textura */
.bg {
  position:absolute; inset:0; z-index:0;
  background: radial-gradient(ellipse 140% 90% at 50% 10%, #0D2857 0%, #062B63 45%, #020A18 100%);
}
.bg::before {
  content:'';
  position:absolute; inset:0;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px),
    radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size: 80px 80px, 40px 40px;
  background-position: 0 0, 20px 20px;
}

/* glow atrás do mascote */
.glow {
  position:absolute; left:50%; bottom:38%; transform:translateX(-50%);
  width:700px; height:700px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,193,7,.10) 0%, transparent 70%);
  z-index:1;
}

/* logo */
.logo-wrap {
  position:absolute; top:80px; left:0; right:0;
  display:flex; justify-content:center; z-index:10;
}
.logo-wrap img { height:240px; object-fit:contain; filter:drop-shadow(0 4px 24px rgba(0,0,0,.6)); }

/* texto acima do mascote */
.supra {
  position:absolute; top:380px; left:0; right:0; z-index:10;
  display:flex; justify-content:center;
}
.supra span {
  font:700 22px/1 'Poppins',sans-serif;
  color:rgba(255,255,255,.5);
  letter-spacing:.3em;
  text-transform:uppercase;
}

/* mascote */
.mascote {
  position:absolute; bottom:330px; left:50%; transform:translateX(-50%);
  z-index:8; width:800px;
  display:flex; justify-content:center;
}
.mascote img {
  width:100%; object-fit:contain;
  filter:drop-shadow(0 24px 60px rgba(0,0,0,.7));
}

/* texto principal sobre o mascote */
.titulo-wrap {
  position:absolute; bottom:600px; left:0; right:0; z-index:12;
  display:flex; flex-direction:column; align-items:center; gap:0;
}
.titulo-wrap .shh {
  font:400 280px/0.85 'Bebas Neue',sans-serif;
  color:#FFC107;
  letter-spacing:.02em;
  text-shadow: 0 0 100px rgba(255,193,7,.25), 0 4px 32px rgba(0,0,0,.6);
}

/* scrim escuro na base */
.scrim {
  position:absolute; left:0; right:0; bottom:0; height:38%; z-index:6;
  background:linear-gradient(180deg, rgba(2,10,24,0) 0%, rgba(2,10,24,.75) 45%, rgba(2,10,24,.97) 100%);
}

/* bloco de texto base */
.base {
  position:absolute; bottom:80px; left:92px; right:92px; z-index:10;
  display:flex; flex-direction:column; align-items:center; gap:20px;
  text-align:center;
  border-top:1.5px solid rgba(255,255,255,.2); padding-top:28px;
}
.base .msg {
  font:600 34px/1.4 'Poppins',sans-serif;
  color:#fff;
  max-width:740px;
}
.base .msg em {
  color:#FFC107; font-style:normal;
}
.base .hd {
  font:700 24px/1 'Poppins',sans-serif;
  color:#FFC107; letter-spacing:.06em;
}

</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SLIDE 1 — MASCOTE SUSPENSE
══════════════════════════════════════ -->
<div class="slide">
  <div class="bg"></div>
  <div class="glow"></div>

  <div class="logo-wrap">
    <img src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">
  </div>

  <div class="supra">
    <span>Tintas Laet</span>
  </div>

  <div class="titulo-wrap">
    <div class="shh">SHHH.</div>
  </div>

  <div class="mascote">
    <img src="../../../../identidade/mascote-suspense-remove-bg-io.png" alt="Mascote Tintas Laet">
  </div>

  <div class="scrim"></div>

  <div class="base">
    <p class="msg">Ele sabe de alguma coisa.<br>E <em>terça-feira</em> você também vai saber.</p>
    <span class="hd">@Tintaslaet</span>
  </div>
</div>

</body>
</html>
