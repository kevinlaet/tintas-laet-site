<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Copa — O Bairro Também Joga</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh;
}

.slide { width:1080px; height:1920px; position:relative; overflow:hidden; flex-shrink:0; }

/* foto de fundo */
.bg {
  position:absolute; inset:0; z-index:0;
}
.bg img {
  width:100%; height:100%;
  object-fit:cover; object-position:center 25%;
}
/* gradiente: escurece topo (logo) e bottom (texto) */
.bg::after {
  content:'';
  position:absolute; inset:0;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,.70) 0%,
      rgba(0,0,0,.10) 28%,
      rgba(0,0,0,.00) 50%,
      rgba(0,0,0,.55) 72%,
      rgba(0,0,0,.88) 100%
    );
}

/* faixa Copa no topo */
.copa-bar {
  position:absolute; top:0; left:0; right:0; height:12px;
  background:linear-gradient(90deg, #009739 0%, #009739 33%, #FEDD00 33%, #FEDD00 67%, #002776 67%, #002776 100%);
  z-index:20;
}

/* logo */
.logo-wrap {
  position:absolute; top:80px; left:0; right:0;
  display:flex; justify-content:center; z-index:10;
}
.logo-wrap img {
  height:96px; object-fit:contain;
  filter:drop-shadow(0 3px 16px rgba(0,0,0,.9));
}

/* bloco de texto no rodapé */
.content {
  position:absolute; bottom:0; left:0; right:0;
  z-index:10;
  padding:0 80px 100px;
}
.tag {
  display:inline-flex; align-items:center; gap:10px;
  font:700 22px/1 'Poppins',sans-serif;
  color:#fff;
  background:rgba(0,151,57,.90);
  padding:10px 26px 10px 22px;
  border-radius:8px;
  letter-spacing:.10em;
  text-transform:uppercase;
  margin-bottom:32px;
}
.tag-flag { font-size:26px; line-height:1; }

.headline {
  font:400 168px/.86 'Bebas Neue',sans-serif;
  color:#FEDD00;
  letter-spacing:.01em;
  text-shadow:0 4px 40px rgba(0,0,0,.7), 0 0 80px rgba(0,0,0,.4);
  margin-bottom:32px;
}

.divisor {
  width:72px; height:5px;
  background:linear-gradient(90deg, #009739, #FEDD00, #002776);
  border-radius:4px;
  margin-bottom:32px;
}

.sub {
  font:500 30px/1.6 'Poppins',sans-serif;
  color:rgba(255,255,255,.88);
  max-width:840px;
  margin-bottom:44px;
}
.sub strong { color:#FEDD00; }

.rodape {
  display:flex; align-items:center; gap:20px;
}
.handle {
  font:700 28px/1 'Poppins',sans-serif;
  color:rgba(255,255,255,.65);
  letter-spacing:.04em;
}
.wpp {
  font:600 26px/1 'Poppins',sans-serif;
  color:rgba(255,255,255,.50);
}
</style>
</head>
<body>
<div class="slide">
  <div class="copa-bar"></div>

  <div class="bg">
    <img src="../../../prova social/foto familia pintando com tinta piso laet.png" alt="Família pintando com as cores do Brasil">
  </div>

  <div class="logo-wrap">
    <img src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">
  </div>

  <div class="content">
    <div class="tag"><span class="tag-flag">🇧🇷</span> Copa do Mundo 2026</div>
    <div class="headline">O BAIRRO<br>TAMBÉM<br>JOGA.</div>
    <div class="divisor"></div>
    <p class="sub">
      Tinta Piso & Fachadas Laet — cobre bem, resiste ao sol, à chuva e ao trânsito.<br>
      <strong>A partir de R$ 219,90.</strong>
    </p>
    <div class="rodape">
      <span class="handle">@Tintaslaet</span>
      <span class="wpp">· (11) 97714-0964</span>
    </div>
  </div>
</div>
</body>
</html>
