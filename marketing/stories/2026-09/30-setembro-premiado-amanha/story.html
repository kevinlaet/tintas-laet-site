<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — Setembro Premiado, sorteio amanhã</title>
<link href="../../../../identidade/fonts/fonts.css" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#020A18;
  display:flex; flex-direction:column; align-items:center;
  font-family:'Montserrat',sans-serif;
}

.slide { width:1080px; height:1920px; position:relative; overflow:hidden; flex-shrink:0; }

.bg { position:absolute; inset:0; z-index:0; }
.bg img { width:100%; height:100%; object-fit:cover; object-position:center 22%; }

.topscrim { position:absolute; left:0; right:0; top:0; height:44%; z-index:3; pointer-events:none;
  background:linear-gradient(180deg, rgba(245,236,215,.94) 0%, rgba(245,236,215,.78) 55%, rgba(245,236,215,0) 100%); }

.scrim { position:absolute; left:0; right:0; bottom:0; height:82%; z-index:4; pointer-events:none;
  background:linear-gradient(180deg, rgba(4,16,35,0) 0%, rgba(4,16,35,.5) 20%, rgba(4,16,35,.92) 52%, rgba(2,10,24,1) 100%); }

.top { position:absolute; top:88px; left:0; right:0; display:flex; flex-direction:column; align-items:center; z-index:10; padding:0 92px; text-align:center; }
.top img.logo { height:280px; object-fit:contain; margin-bottom:20px; }
.ey { font:800 26px/1 'Poppins',sans-serif; color:#0D47A1; letter-spacing:.2em; text-transform:uppercase; display:flex; align-items:center; gap:16px; }
.ey::before,.ey::after { content:''; width:34px; height:3px; background:rgba(13,71,161,.5); display:block; }

.h1 { position:absolute; top:440px; left:0; right:0; z-index:10; text-align:center; padding:0 60px; }
.h1 .mes { font:400 128px/.95 'Bebas Neue',sans-serif; color:#062B63; text-shadow:0 2px 10px rgba(255,255,255,.4); }
.h1 .chip { background:#FFC107; color:#062B63; padding:6px 34px; border-radius:16px; display:inline-block; font:400 116px/1 'Bebas Neue',sans-serif; transform:rotate(-2deg); margin-top:6px; }

.urgencia { position:absolute; top:700px; left:0; right:0; z-index:10; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 80px; }
.urgencia .label { font:800 34px/1 'Poppins',sans-serif; color:#fff; letter-spacing:.14em; text-transform:uppercase; margin-bottom:6px; text-shadow:0 2px 16px rgba(0,0,0,.7); }
.urgencia .grande { font:400 220px/.85 'Bebas Neue',sans-serif; color:#FFC107; text-shadow:0 8px 40px rgba(0,0,0,.6); }

.premios-bloco { position:absolute; bottom:300px; left:80px; right:80px; z-index:10; display:flex; flex-direction:column; gap:16px; }
.premio-pill { background:rgba(255,193,7,.15); border:2px solid #FFC107; border-radius:20px; padding:20px 40px; text-align:center; }
.premio-pill span { font:700 25px/1.2 'Poppins',sans-serif; color:#FFC107; letter-spacing:.05em; text-transform:uppercase; }
.premio-pill strong { display:block; font:400 50px/1 'Bebas Neue',sans-serif; color:#fff; margin-top:6px; }
.premio-pill.amigo { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.4); }
.premio-pill.amigo span { color:rgba(255,255,255,.7); }
.premio-pill.amigo strong { font-size:40px; }

.bot { position:absolute; bottom:64px; left:92px; right:92px; display:flex; flex-direction:column; align-items:center; gap:16px; z-index:10; text-align:center; border-top:1.5px solid rgba(255,255,255,.3); padding-top:24px; }
.bot .cta { font:800 32px/1.3 'Poppins',sans-serif; color:#fff; }
.bot .hd { font:700 20px/1 'Poppins',sans-serif; color:#FFC107; letter-spacing:.05em; }

</style>
</head>
<body>

<div class="slide s1">
  <div class="bg"><img src="../../../prova social/ganhador-caixa-de-som.jpg.jfif" alt="Ganhador de sorteio anterior da Tintas Laet"></div>
  <div class="topscrim"></div>

  <div class="top">
    <img class="logo" src="../../../../identidade/logo tipo original-remove-bg-io.png" alt="Tintas Laet">
    <div class="ey">Sorteio mensal</div>
  </div>

  <div class="h1">
    <div class="mes">SETEMBRO</div>
    <div class="chip">PREMIADO</div>
  </div>

  <div class="scrim"></div>

  <div class="urgencia">
    <div class="label">O sorteio é</div>
    <div class="grande">AMANHÃ</div>
  </div>

  <div class="premios-bloco">
    <div class="premio-pill">
      <span>Prêmio principal</span>
      <strong>Caixa de Som Mondial 250W</strong>
    </div>
    <div class="premio-pill amigo">
      <span>Prêmio do amigo indicado</span>
      <strong>Tinta Cobertura Absoluta 3,6L Branca</strong>
    </div>
  </div>

  <div class="bot">
    <p class="cta">Ainda dá tempo! Compra hoje, preenche seu cupom na loja e concorre amanhã.</p>
    <span class="hd">@Tintaslaet</span>
  </div>
</div>

</body>
</html>
