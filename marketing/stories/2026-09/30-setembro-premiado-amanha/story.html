<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Tintas Laet — Setembro Premiado, sorteio amanhã</title>
<link href="../../../../identidade/fonts/fonts.css" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#020A18;
  display:flex; flex-direction:column; align-items:center;
  font-family:'Montserrat',sans-serif;
}

.slide { width:1080px; height:1920px; position:relative; overflow:hidden; flex-shrink:0; background:#0D47A1; }

/* Metade de cima: foto inteira (ganhador + balconista), sem corte nem
   texto por cima — o quadro 1080x960 é quase quadrado, então um cover
   simples preserva os dois lados da foto e só apara topo/base. */
.foto-topo { position:absolute; top:0; left:0; right:0; height:960px; overflow:hidden; }
.foto-topo img { width:100%; height:100%; object-fit:cover; object-position:center 32%; display:block; }

/* Costura entre a foto e o painel — faixa dourada + selo, não um corte
   reto seco (mesma lógica de "nunca ficar plano demais" do design-guide). */
.costura { position:absolute; top:944px; left:0; right:0; height:16px; background:#FFC107; z-index:5; }
.selo { position:absolute; top:900px; left:50%; transform:translateX(-50%); z-index:6;
  background:#FFC107; color:#062B63; font:800 24px/1 'Poppins',sans-serif; letter-spacing:.12em; text-transform:uppercase;
  padding:16px 36px; border-radius:14px; box-shadow:0 10px 24px rgba(0,0,0,.35); }

/* Metade de baixo: painel sólido com todo o conteúdo — cheio, não vazio. */
.painel { position:absolute; top:960px; left:0; right:0; bottom:0; background:#0D47A1; z-index:2;
  display:flex; flex-direction:column; align-items:center; padding:56px 72px 40px; text-align:center; }

.logo { width:160px; object-fit:contain; margin-bottom:18px; }

.mes { font:400 92px/.88 'Bebas Neue',sans-serif; color:#fff; }
.premiado { font:400 92px/.88 'Bebas Neue',sans-serif; color:#FFC107; margin-bottom:18px; }

.stat { margin-bottom:22px; }
.stat .rotulo { font:800 22px/1.3 'Poppins',sans-serif; color:rgba(255,255,255,.7); letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; }
.stat .valor { font:400 78px/.9 'Bebas Neue',sans-serif; color:#FFC107; }

.premios { display:flex; gap:20px; width:100%; margin-bottom:auto; }
.premio { flex:1; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.25); border-radius:18px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; }
.premio .ico { width:44px; height:44px; border-radius:50%; background:#FFC107; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
.premio .rotulo { font:800 15px/1.3 'Poppins',sans-serif; color:#FFC107; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; }
.premio .valor { font:700 20px/1.25 'Montserrat',sans-serif; color:#fff; }

.rodape { width:100%; padding-top:18px; margin-top:18px; border-top:1.5px solid rgba(255,255,255,.25); }
.cta { font:700 21px/1.35 'Poppins',sans-serif; color:#fff; margin-bottom:10px; }
.handle { font:700 18px/1 'Poppins',sans-serif; color:#FFC107; letter-spacing:.05em; }

</style>
</head>
<body>

<div class="slide">
  <div class="foto-topo">
    <img src="../../../prova social/ganhador-caixa-de-som.jpg.jfif" alt="Ganhador e balconista da Tintas Laet com o prêmio">
  </div>

  <div class="costura"></div>
  <div class="selo">Sorteio mensal</div>

  <div class="painel">
    <img class="logo" src="../../../../identidade/logotipo branco-remove-bg-io.png" alt="Tintas Laet">

    <div class="mes">SETEMBRO</div>
    <div class="premiado">PREMIADO</div>

    <div class="stat">
      <div class="rotulo">O sorteio é</div>
      <div class="valor">AMANHÃ</div>
    </div>

    <div class="premios">
      <div class="premio">
        <div class="ico">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#062B63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a2 2 0 0 0 2 4M17 5h3a2 2 0 0 1-2 4"/></svg>
        </div>
        <div class="rotulo">Prêmio principal</div>
        <div class="valor">Caixa de Som Mondial 250W</div>
      </div>
      <div class="premio">
        <div class="ico">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#062B63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><circle cx="17.5" cy="8" r="2.6"/><path d="M15.6 13.8c2.9.4 5 2.7 5 5.9"/></svg>
        </div>
        <div class="rotulo">Prêmio do amigo indicado</div>
        <div class="valor">Tinta Cobertura Absoluta 3,6L Branca</div>
      </div>
    </div>

    <div class="rodape">
      <p class="cta">Ainda dá tempo! Compra hoje, preenche seu cupom na loja e concorre amanhã.</p>
      <span class="handle">@Tintaslaet</span>
    </div>
  </div>
</div>

</body>
</html>
